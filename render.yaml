services:
  - type: web
    name: sdmesh-server
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: sdmesh-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: /opt/render/project/src/data/sdmesh.db
      - key: SERVER_SECRET
        generateValue: true
