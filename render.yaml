services:
  - type: web
    name: sdmesh-server
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: sdmesh-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: /opt/render/project/src/data/sdmesh.db
      - key: API_BIND
        value: 127.0.0.1:3001
      - key: SERVER_SECRET
        generateValue: true
